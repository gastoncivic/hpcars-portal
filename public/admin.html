<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HP CARS — Panel Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Barlow:wght@400;500;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07080f;--bg2:#0d0f1a;--bg3:#12151f;--red:#e8321a;--amber:#f5a623;--blue:#2b7de9;--green:#2ed573;--text:#e8eaf0;--muted:#7a8296;--border:#1e2235;--glass:rgba(255,255,255,.04);--glass2:rgba(255,255,255,.07)}
body{background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;display:flex;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0d0f1a}::-webkit-scrollbar-thumb{background:var(--red);border-radius:2px}
.sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100}
.sb-logo{padding:1.1rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;text-decoration:none}
.sb-logo-t{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;color:#fff}
.sb-logo-t span{color:var(--red)}
.sb-badge{background:rgba(245,166,35,.2);color:var(--amber);font-size:.55rem;font-family:'Barlow Condensed',sans-serif;font-weight:800;padding:2px 7px;border-radius:3px;letter-spacing:1px;border:1px solid rgba(245,166,35,.3)}
.sb-nav{flex:1;padding:1rem 0;overflow-y:auto}
.sb-sec{padding:.4rem 1.5rem .2rem;font-size:.62rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;font-family:'Barlow Condensed',sans-serif}
.sb-item{display:flex;align-items:center;gap:.7rem;padding:.6rem 1.5rem;color:var(--muted);text-decoration:none;font-size:.88rem;cursor:pointer;border:none;background:none;width:100%;transition:.15s}
.sb-item:hover{color:var(--text);background:var(--glass)}
.sb-item.active{color:var(--amber);background:rgba(245,166,35,.07);border-right:2px solid var(--amber)}
.sb-bottom{padding:1rem 1.5rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-user-info .name{font-size:.82rem;font-weight:600}
.sb-user-info .role{font-size:.68rem;color:var(--amber);text-transform:uppercase;letter-spacing:.5px}
.sb-out{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.9rem}
.sb-out:hover{color:var(--red)}
.main{margin-left:220px;flex:1;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:rgba(7,8,15,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:.8rem 2rem;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;font-weight:800}
.tb-refresh{background:var(--glass);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:600;transition:.2s}
.tb-refresh:hover{background:var(--glass2);color:var(--text)}
.content{padding:1.75rem;flex:1}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1.1rem;margin-bottom:2rem}
.kpi{background:var(--glass);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.25rem;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--c)}
.kpi[data-c=r]{--c:var(--red)}.kpi[data-c=a]{--c:var(--amber)}.kpi[data-c=b]{--c:var(--blue)}.kpi[data-c=g]{--c:var(--green)}
.kpi-icon{font-size:1.2rem;margin-bottom:.3rem}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900}
.kpi-label{font-size:.73rem;color:var(--muted);margin-top:.15rem}
.two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:1.5rem;margin-bottom:2rem}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.card{background:var(--glass);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.card-head{padding:.875rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-head h3{font-family:'Barlow Condensed',sans-serif;font-size:1.05rem;font-weight:800}
.card-body{padding:1.25rem}
.chart-bars{display:flex;align-items:flex-end;gap:.5rem;height:100px}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:.3rem}
.bar{width:100%;border-radius:4px 4px 0 0;background:var(--red);opacity:.7;min-height:4px;transition:.3s}
.bar-label{font-size:.65rem;color:var(--muted)}
.donut-wrap{display:flex;flex-direction:column;gap:.75rem}
.donut-item{display:flex;align-items:center;gap:.75rem}
.donut-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.donut-name{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:700;flex:1}
.donut-val{font-family:'Barlow Condensed',sans-serif;font-size:.88rem;font-weight:700}
.donut-bar{flex:2;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.donut-fill{height:100%;border-radius:3px;transition:.5s}
table{width:100%;border-collapse:collapse}
thead th{background:var(--bg2);padding:.65rem 1rem;font-size:.7rem;font-weight:700;letter-spacing:1px;color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
tbody tr{border-bottom:1px solid rgba(255,255,255,.025);transition:.1s}
tbody tr:hover{background:var(--glass2)}
td{padding:.75rem 1rem;font-size:.83rem}
.badge{display:inline-flex;align-items:center;font-family:'Barlow Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:4px}
.s-pending{background:rgba(245,166,35,.1);color:var(--amber);border:1px solid rgba(245,166,35,.2)}
.s-processing{background:rgba(43,125,233,.1);color:var(--blue);border:1px solid rgba(43,125,233,.2)}
.s-ready{background:rgba(46,213,115,.1);color:var(--green);border:1px solid rgba(46,213,115,.2)}
.s-completed{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}
.s-waiting{background:rgba(232,50,26,.1);color:var(--red);border:1px solid rgba(232,50,26,.2)}
.b-chiptuning{background:rgba(232,50,26,.1);color:var(--red)}.b-immo{background:rgba(245,166,35,.1);color:var(--amber)}.b-seedkey{background:rgba(43,125,233,.1);color:var(--blue)}.b-special{background:rgba(46,213,115,.1);color:var(--green)}
.tbl-wrap{overflow:auto}
.action-btn{background:var(--glass);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:5px;font-size:.72rem;cursor:pointer;transition:.15s;font-family:'Barlow Condensed',sans-serif;font-weight:700}
.action-btn:hover{background:var(--glass2)}
.action-btn.green{border-color:rgba(46,213,115,.3);color:var(--green)}
.action-btn.red{border-color:rgba(232,50,26,.3);color:var(--red)}
.action-btn.blue{border-color:rgba(43,125,233,.3);color:var(--blue)}
.action-btn.amber{border-color:rgba(245,166,35,.3);color:var(--amber)}
.tabs{display:flex;gap:.5rem;margin-bottom:1.25rem;border-bottom:1px solid var(--border);padding-bottom:.75rem}
.tab{background:none;border:1px solid transparent;color:var(--muted);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;transition:.15s;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px}
.tab:hover{background:var(--glass);color:var(--text)}
.tab.active{background:rgba(245,166,35,.1);border-color:rgba(245,166,35,.3);color:var(--amber)}
.filter-row{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.filter-btn{background:var(--glass);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:5px;cursor:pointer;font-size:.75rem;font-weight:600;transition:.15s}
.filter-btn:hover,.filter-btn.active{background:var(--amber);border-color:var(--amber);color:#000}
.empty{text-align:center;padding:2rem;color:var(--muted);font-size:.88rem}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.875rem 1.25rem;font-size:.875rem;z-index:9999;max-width:300px;display:flex;gap:.6rem;align-items:center;transform:translateX(110%);transition:.3s;border-left:3px solid var(--green)}
.toast.show{transform:translateX(0)}.toast.err{border-left-color:var(--red)}
@media(max-width:700px){.main{margin-left:0}.sidebar{display:none}}
</style>
</head>
<body>

<aside class="sidebar">
  <a class="sb-logo" href="/"><div class="sb-logo-t">HP<span>CARS</span></div><span class="sb-badge">ADMIN</span></a>
  <nav class="sb-nav">
    <div class="sb-sec">Panel</div>
    <button class="sb-item active" onclick="switchTab('stats',this)">📊 Estadísticas</button>
    <button class="sb-item" onclick="switchTab('queue',this)">📁 Cola de archivos</button>
    <button class="sb-item" onclick="switchTab('users',this)">👥 Usuarios</button>
    <button class="sb-item" onclick="switchTab('logs',this)">📋 Actividad</button>
    <div class="sb-sec" style="margin-top:.5rem">Config</div>
    <button class="sb-item" onclick="window.location.href='/dashboard.html'">🏠 Ver portal</button>
    <button class="sb-item" style="color:rgba(245,166,35,.5)">💳 Paddle (pronto)</button>
  </nav>
  <div class="sb-bottom">
    <div class="sb-user-info"><div class="name" id="sbName">Admin</div><div class="role">Administrator</div></div>
    <button class="sb-out" onclick="logout()" title="Salir">⏻</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="tabTitle">📊 Estadísticas</div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <span id="autoRefreshLabel" style="font-size:.72rem;color:var(--muted)">Auto-refresh 60s</span>
      <button class="tb-refresh" onclick="loadAll()">↺ Actualizar</button>
    </div>
  </div>

  <div class="content">

    <!-- ═══ STATS ═══ -->
    <div id="tab-stats">
      <div class="kpi-grid">
        <div class="kpi" data-c="r"><div class="kpi-icon">👥</div><div class="kpi-val" id="kTotalUsers">—</div><div class="kpi-label">Usuarios totales</div></div>
        <div class="kpi" data-c="b"><div class="kpi-icon">📁</div><div class="kpi-val" id="kTotalFiles">—</div><div class="kpi-label">Archivos enviados</div></div>
        <div class="kpi" data-c="a"><div class="kpi-icon">⏳</div><div class="kpi-val" id="kPending">—</div><div class="kpi-label">Cola pendiente</div></div>
        <div class="kpi" data-c="g"><div class="kpi-icon">✅</div><div class="kpi-val" id="kCompleted">—</div><div class="kpi-label">Completados</div></div>
        <div class="kpi" data-c="r"><div class="kpi-icon">🆕</div><div class="kpi-val" id="kUsersToday">—</div><div class="kpi-label">Usuarios hoy</div></div>
        <div class="kpi" data-c="b"><div class="kpi-icon">📤</div><div class="kpi-val" id="kFilesToday">—</div><div class="kpi-label">Archivos hoy</div></div>
      </div>
      <div class="two-col">
        <div class="card">
          <div class="card-head"><h3>📈 Actividad — últimos 7 días</h3></div>
          <div class="card-body"><div class="chart-bars" id="chartBars"></div></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>🍩 Por rama</h3></div>
          <div class="card-body"><div class="donut-wrap" id="donutWrap"></div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>📄 Últimos archivos</h3></div>
        <div class="tbl-wrap" id="recentFilesTable"><div class="empty">Cargando…</div></div>
      </div>
    </div>

    <!-- ═══ QUEUE ═══ -->
    <div id="tab-queue" style="display:none">
      <div class="filter-row" id="queueFilters">
        <button class="filter-btn active" data-f="all" onclick="filterQueue(this)">Todos</button>
        <button class="filter-btn" data-f="pending" onclick="filterQueue(this)">⏳ Pendientes</button>
        <button class="filter-btn" data-f="processing" onclick="filterQueue(this)">⚙️ Procesando</button>
        <button class="filter-btn" data-f="waiting" onclick="filterQueue(this)">🕐 Esperando</button>
        <button class="filter-btn" data-f="ready" onclick="filterQueue(this)">✅ Listos</button>
      </div>
      <div class="card"><div class="tbl-wrap" id="queueTable"><div class="empty">Cargando…</div></div></div>
    </div>

    <!-- ═══ USERS ═══ -->
    <div id="tab-users" style="display:none">
      <div class="card"><div class="tbl-wrap" id="usersTable"><div class="empty">Cargando…</div></div></div>
    </div>

    <!-- ═══ LOGS ═══ -->
    <div id="tab-logs" style="display:none">
      <div class="card"><div class="tbl-wrap" id="logsTable"><div class="empty">Cargando…</div></div></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"><span id="ti">✅</span><span id="tm"></span></div>

<script>
// ─── AUTH ───
const token = localStorage.getItem('hpcars_token');
const user = JSON.parse(localStorage.getItem('hpcars_user') || 'null');
const ADMIN_EMAILS = ['angelgastoncalvo@gmail.com'];
if (!token || !user) { window.location.href = '/'; }
if (user && user.role !== 'admin' && !ADMIN_EMAILS.includes(user.email)) { window.location.href = '/dashboard.html'; }
if (user) document.getElementById('sbName').textContent = user.name?.split(' ')[0] || 'Admin';

// ─── HELPERS ───
function toast(msg, type='ok') {
  const t = document.getElementById('toast');
  document.getElementById('ti').textContent = {ok:'✅',err:'❌',info:'ℹ️',warn:'⚠️'}[type]||'✅';
  document.getElementById('tm').textContent = msg;
  t.className = 'toast'+(type==='err'?' err':'')+' show';
  setTimeout(()=>t.classList.remove('show'), 4000);
}
function api(path, opts={}) { return fetch(path, { ...opts, headers: { ...opts.headers, Authorization: 'Bearer '+token, 'Content-Type': 'application/json' } }).then(r=>r.json()); }
function timeAgo(dt) { const d=new Date(dt),now=new Date(),m=Math.floor((now-d)/60000); if(m<1)return 'ahora'; if(m<60)return m+'min'; const h=Math.floor(m/60); if(h<24)return h+'h'; return Math.floor(h/24)+'d'; }
function statusBadge(s) { const m={pending:['s-pending','⏳ Pendiente'],processing:['s-processing','⚙️ Procesando'],waiting:['s-waiting','🕐 Esperando'],ready:['s-ready','✅ Listo'],completed:['s-completed','✓ Listo']}; const[c,l]=m[s]||['s-pending',s]; return `<span class="badge ${c}">${l}</span>`; }
function branchBadge(s) { const m={chiptuning:['b-chiptuning','Chiptuning'],immo:['b-immo','IMMO OFF'],seedkey:['b-seedkey','Seed Key'],special:['b-special','Especiales']}; const[c,l]=m[s]||['b-chiptuning',s]; return `<span class="badge ${c}">${l}</span>`; }
function logout() { localStorage.clear(); window.location.href='/'; }

// ─── TABS ───
const tabs = ['stats','queue','users','logs'];
const tabTitles = {stats:'📊 Estadísticas',queue:'📁 Cola de archivos',users:'👥 Usuarios',logs:'📋 Actividad'};
function switchTab(t, el) {
  tabs.forEach(x => document.getElementById('tab-'+x).style.display = x===t ? '' : 'none');
  document.querySelectorAll('.sb-item').forEach(e => e.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('tabTitle').textContent = tabTitles[t];
  if(t==='queue') loadQueue();
  if(t==='users') loadUsers();
  if(t==='logs') loadLogs();
}

// ─── STATS ───
let allFiles = [], allUsers = [];
let queueFilter = 'all';

async function loadStats() {
  const d = await api('/api/admin/stats');
  document.getElementById('kTotalUsers').textContent = d.totalUsers ?? '—';
  document.getElementById('kTotalFiles').textContent = d.totalFiles ?? '—';
  document.getElementById('kPending').textContent = d.pendingFiles ?? '—';
  document.getElementById('kCompleted').textContent = d.completedFiles ?? '—';
  document.getElementById('kUsersToday').textContent = d.usersToday ?? '—';
  document.getElementById('kFilesToday').textContent = d.filesToday ?? '—';

  // Chart
  const days = d.dailyActivity || [];
  const max = Math.max(...days.map(x=>x.count), 1);
  document.getElementById('chartBars').innerHTML = days.map(x => `
    <div class="bar-wrap">
      <div class="bar" style="height:${Math.max((x.count/max)*90,4)}px" title="${x.count}"></div>
      <div class="bar-label">${x.day}</div>
    </div>`).join('');

  // Donut
  const bb = d.byBranch || {};
  const total = Object.values(bb).reduce((a,b)=>a+b,0) || 1;
  const branches = [{key:'chiptuning',label:'Chiptuning',color:'var(--red)'},{key:'immo',label:'IMMO OFF',color:'var(--amber)'},{key:'seedkey',label:'Seed Key',color:'var(--blue)'},{key:'special',label:'Especiales',color:'var(--green)'}];
  document.getElementById('donutWrap').innerHTML = branches.map(b => {
    const v = bb[b.key] || 0;
    const pct = Math.round((v/total)*100);
    return `<div class="donut-item">
      <div class="donut-dot" style="background:${b.color}"></div>
      <div class="donut-name">${b.label}</div>
      <div class="donut-bar"><div class="donut-fill" style="width:${pct}%;background:${b.color}"></div></div>
      <div class="donut-val">${v}</div>
    </div>`;
  }).join('');
}

async function loadRecentFiles() {
  const d = await api('/api/admin/files');
  allFiles = d.files || [];
  renderFileTable(document.getElementById('recentFilesTable'), allFiles.slice(0,10), true);
}

function renderFileTable(el, files, compact=false) {
  if (!files.length) { el.innerHTML = '<div class="empty">Sin archivos</div>'; return; }
  const rows = files.map(f => `
    <tr>
      <td><strong>${f.brand||'—'} ${f.model||''}</strong><br/><span style="font-size:.72rem;color:var(--muted)">${f.user_email||''}</span></td>
      <td>${branchBadge(f.service)}</td>
      <td>${statusBadge(f.status)}</td>
      <td style="color:var(--muted);font-size:.75rem">${timeAgo(f.created_at)}</td>
      ${compact ? '' : `<td>
        <button class="action-btn green" onclick="setStatus(${f.id},'ready')">✅ Listo</button>
        <button class="action-btn blue" onclick="setStatus(${f.id},'processing')">⚙️</button>
        <button class="action-btn amber" onclick="setStatus(${f.id},'waiting')">🕐</button>
        <button class="action-btn red" onclick="delFile(${f.id})">🗑️</button>
      </td>`}
    </tr>`).join('');
  el.innerHTML = `<table><thead><tr>
    <th>Vehículo / Usuario</th><th>Rama</th><th>Status</th><th>Hace</th>
    ${compact ? '' : '<th>Acciones</th>'}
  </tr></thead><tbody>${rows}</tbody></table>`;
}

// ─── QUEUE ───
async function loadQueue() {
  const d = await api('/api/admin/files');
  allFiles = d.files || [];
  renderQueue();
}
function filterQueue(btn) {
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  queueFilter = btn.dataset.f;
  renderQueue();
}
function renderQueue() {
  const files = queueFilter === 'all' ? allFiles : allFiles.filter(f=>f.status===queueFilter);
  renderFileTable(document.getElementById('queueTable'), files, false);
}

async function setStatus(id, status) {
  await api(`/api/admin/files/${id}/status`, { method:'PUT', body:JSON.stringify({status}) });
  toast(`Status actualizado: ${status}`);
  loadQueue(); loadRecentFiles();
}
async function delFile(id) {
  if (!confirm('¿Eliminar este archivo?')) return;
  await api(`/api/admin/files/${id}`, { method:'DELETE' });
  toast('Archivo eliminado');
  loadQueue(); loadRecentFiles();
}

// ─── USERS ───
async function loadUsers() {
  const d = await api('/api/admin/users');
  allUsers = d.users || [];
  if (!allUsers.length) { document.getElementById('usersTable').innerHTML = '<div class="empty">Sin usuarios</div>'; return; }
  const rows = allUsers.map(u => `
    <tr>
      <td><strong>${u.name}</strong><br/><span style="font-size:.72rem;color:var(--muted)">${u.email}</span></td>
      <td><span class="badge ${u.role==='admin'?'s-waiting':'s-completed'}">${u.role.toUpperCase()}</span></td>
      <td><span class="badge ${u.membership_level==='enterprise'?'s-ready':u.membership_level==='pro'?'s-processing':'s-completed'}">${(u.membership_level||'free').toUpperCase()}</span></td>
      <td>${u.file_count||0}</td>
      <td style="color:var(--muted);font-size:.75rem">${timeAgo(u.created_at)}</td>
      <td>
        <button class="action-btn" onclick="setMembership(${u.id},'free')">FREE</button>
        <button class="action-btn amber" onclick="setMembership(${u.id},'pro')">PRO</button>
        <button class="action-btn green" onclick="setMembership(${u.id},'enterprise')">ENT</button>
        <button class="action-btn blue" onclick="toggleAdmin(${u.id},'${u.role}')">${u.role==='admin'?'→ User':'→ Admin'}</button>
        <button class="action-btn red" onclick="deleteUser(${u.id},'${u.name}')">🗑️</button>
      </td>
    </tr>`).join('');
  document.getElementById('usersTable').innerHTML = `<table><thead><tr>
    <th>Usuario</th><th>Rol</th><th>Plan</th><th>Archivos</th><th>Desde</th><th>Acciones</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}
async function setMembership(id, level) {
  await api(`/api/admin/users/${id}/membership`, { method:'PUT', body:JSON.stringify({level}) });
  toast('Plan actualizado: '+level.toUpperCase());
  loadUsers();
}
async function toggleAdmin(id, currentRole) {
  const role = currentRole === 'admin' ? 'user' : 'admin';
  await api(`/api/admin/users/${id}/role`, { method:'PUT', body:JSON.stringify({role}) });
  toast('Rol actualizado: '+role);
  loadUsers();
}
async function deleteUser(id, name) {
  if (!confirm(`¿Eliminar al usuario "${name}"? Esta acción no se puede deshacer.`)) return;
  await api(`/api/admin/users/${id}`, { method:'DELETE' });
  toast('Usuario eliminado');
  loadUsers();
}

// ─── LOGS ───
async function loadLogs() {
  const d = await api('/api/admin/logs');
  const logs = d.logs || [];
  if (!logs.length) { document.getElementById('logsTable').innerHTML = '<div class="empty">Sin actividad</div>'; return; }
  const rows = logs.map(l => `
    <tr>
      <td style="color:var(--muted);font-size:.75rem">${timeAgo(l.created_at)}</td>
      <td>${l.email||'—'}</td>
      <td><span class="badge s-processing">${l.action||'—'}</span></td>
      <td style="font-size:.75rem;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis">${l.details||''}</td>
    </tr>`).join('');
  document.getElementById('logsTable').innerHTML = `<table><thead><tr>
    <th>Hace</th><th>Email</th><th>Acción</th><th>Detalles</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

// ─── LOAD ALL ───
async function loadAll() {
  await loadStats();
  await loadRecentFiles();
}

loadAll();
setInterval(loadAll, 60000);
